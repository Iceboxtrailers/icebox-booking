name: CI

# On every push to master and on every pull request: lint, type-check and run the unit tests. None of
# it needs a database or a secret. (Vercel builds and deploys on its own; this is the safety net that
# says whether the code still does what the tests describe: prices, taxes, dates, redirects, uploads.)
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `prisma generate` (run by `npm ci`) reads the schema and never connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
