name: CI

# On every push to master and on every pull request: lint, type-check, run the unit tests, then the
# database tests against a throwaway Postgres (tests/db: the booking lock, availability, counters, the
# journal and the reports run their real queries). No secret is needed. (Vercel builds and deploys on its
# own; this is the safety net that says whether the code still does what the tests describe: prices,
# taxes, dates, redirects, uploads, who gets a trailer.)
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # `prisma generate` (run by `npm ci`) reads the schema and never connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # Where `npm run test:db` applies the migrations and runs its tests (the database is emptied).
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
